<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4E2A84"/></marker>
  </defs>
  <style>
    .t { fill:#4E2A84; font-weight:700; }
    .s { fill:#6b6b6b; font-size:11.5px; }
    .ref { fill:none; stroke:#c9c4d6; stroke-width:1.5; stroke-dasharray:4 4; }
    .def { fill:#f5f1fb; stroke:#4E2A84; stroke-width:2; }
    .ar { stroke:#4E2A84; stroke-width:2; marker-end:url(#ah); }
    .code { fill:#7a5aa8; font-family:'SF Mono', Consolas, monospace; font-size:10px; }
    .fixed { stroke:#9a93ad; stroke-width:2.5; }
  </style>

  <text x="450" y="30" text-anchor="middle" font-size="20" class="t">Four ways to deform a simulation box</text>
  <text x="450" y="50" text-anchor="middle" class="s">Dashed = original shape. Purple = deformed. In LAMMPS these are all one command: fix deform.</text>

  <!-- Tensile  (center 158) -->
  <text x="158" y="90" text-anchor="middle" font-size="14" class="t">Tensile (uniaxial)</text>
  <rect x="123" y="110" width="70" height="70" class="ref"/>
  <rect x="108" y="110" width="100" height="70" class="def"/>
  <line class="ar" x1="105" y1="145" x2="75" y2="145"/>
  <line class="ar" x1="211" y1="145" x2="241" y2="145"/>
  <text x="158" y="205" text-anchor="middle" class="s">pull along one axis</text>
  <text x="158" y="222" text-anchor="middle" class="code">fix ... deform 1 x erate ${e}</text>

  <!-- Compression  (center 352) -->
  <text x="352" y="90" text-anchor="middle" font-size="14" class="t">Compression</text>
  <rect x="317" y="110" width="70" height="70" class="ref"/>
  <rect x="330" y="110" width="44" height="70" class="def"/>
  <line class="ar" x1="307" y1="145" x2="328" y2="145"/>
  <line class="ar" x1="397" y1="145" x2="376" y2="145"/>
  <text x="352" y="205" text-anchor="middle" class="s">push along one axis</text>
  <text x="352" y="222" text-anchor="middle" class="code">fix ... deform 1 x erate -${e}</text>

  <!-- Shear  (center 547) -->
  <text x="547" y="90" text-anchor="middle" font-size="14" class="t">Shear</text>
  <rect x="512" y="110" width="70" height="70" class="ref"/>
  <polygon points="532,110 602,110 582,180 512,180" class="def"/>
  <line class="ar" x1="532" y1="102" x2="604" y2="102"/>
  <line class="fixed" x1="508" y1="183" x2="586" y2="183"/>
  <text x="547" y="205" text-anchor="middle" class="s">slide top past fixed bottom</text>
  <text x="547" y="222" text-anchor="middle" class="code">fix ... deform 1 xy erate ${e}</text>

  <!-- Dilation  (center 742) -->
  <text x="742" y="90" text-anchor="middle" font-size="14" class="t">Dilation (volumetric)</text>
  <rect x="719" y="122" width="46" height="46" class="ref"/>
  <rect x="707" y="110" width="70" height="70" class="def"/>
  <line class="ar" x1="704" y1="107" x2="689" y2="92"/>
  <line class="ar" x1="780" y1="183" x2="795" y2="198"/>
  <text x="742" y="205" text-anchor="middle" class="s">expand all axes equally</text>
  <text x="742" y="222" text-anchor="middle" class="code">deform x,y,z erate ${e}</text>

  <!-- caption -->
  <rect x="60" y="255" width="780" height="62" rx="10" fill="#f5f1fb" stroke="#d7d3e0"/>
  <text x="450" y="278" text-anchor="middle" font-size="12.5" fill="#2b2b2b"><tspan font-weight="700" fill="#4E2A84">The idea:</tspan> you impose a known deformation (strain) and let LAMMPS report the resisting force per area (stress).</text>
  <text x="450" y="298" text-anchor="middle" font-size="12.5" fill="#2b2b2b">The relationship between the two &#8212; the stress&#8211;strain curve &#8212; is the material's mechanical fingerprint.</text>
</svg>
